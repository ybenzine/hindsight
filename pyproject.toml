[project]
name = "hindsight"
version = "0.1.0"
description = "Hindsight — team feedback cycles and retrospectives"
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
